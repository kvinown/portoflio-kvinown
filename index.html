<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Kevin Owen | Fullstack Developer</title> 
    <meta name="title" content="Kevin Owen | Fullstack Developer" />
    <meta name="description" content="Portofolio resmi Kevin Owen. Fullstack Developer, Frontend, dan Backend Specialist dari Jakarta, Indonesia." />
    <meta name="keywords" content="Kevin Owen, Fullstack Developer, Frontend Developer, Backend Developer, Web Developer Jakarta, Laravel, React, NestJS, TypeScript, Prompt Engineer" />
    <meta name="author" content="Kevin Owen" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kevinowen.netlify.app/" />
    <meta property="og:title" content="Kevin Owen | Fullstack Developer" />
    <meta property="og:description" content="Lihat portofolio dan studi kasus proyek pengembangan perangkat lunak oleh Kevin Owen." />
    <meta property="og:image" content="/favicon.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kevinowen.netlify.app/" />
    <meta property="twitter:title" content="Kevin Owen | Fullstack Developer" />
    <meta property="twitter:description" content="Lihat portofolio dan studi kasus proyek pengembangan perangkat lunak oleh Kevin Owen." />
    <meta property="twitter:image" content="/favicon.jpg" />

    <!-- JSON-LD Structured Data for Google Knowledge Graph (Tanpa Email & No HP) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Person",
      "name": "Kevin Owen",
      "jobTitle": "Fullstack Developer",
      "url": "https://kevinowen.netlify.app",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Jakarta",
        "addressCountry": "ID"
      },
      "sameAs": [
        "https://github.com/kvinown",
        "https://linkedin.com/in/kevin-owen"
      ]
    }
    </script>
  </head>
  <body>
    <!-- DUMMY FORM UNTUK NETLIFY (Harus di luar div root) -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
